<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ST导航 - 星空搜索</title>
    <style>
        /* ================= 基础样式 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050510;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ================= 左上角毛玻璃返回按钮 ================= */
        .back-home-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            right: auto;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .back-home-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            opacity: 0.7;
            pointer-events: none;
        }

        .back-home-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(136,176,255,0.25), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .back-home-btn:hover::after { left: 100%; }

        .back-home-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(136, 176, 255, 0.6);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                0 0 20px rgba(136, 176, 255, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .back-home-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .back-home-btn svg {
            transition: transform 0.35s ease;
            flex-shrink: 0;
        }

        .back-home-btn:hover svg { transform: translateX(-4px); }

        @media (max-width: 600px) {
            .back-home-btn {
                top: 16px;
                left: 16px;
                padding: 8px 14px;
                font-size: 13px;
            }
        }

        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ================= 主容器 ================= */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            justify-content: center;
            padding: 20px;
        }

        body.is-searching .main-container {
            justify-content: flex-start;
            padding-top: 40px;
        }

        /* ================= 头部区域 ================= */
        .header-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ================= 时间与天气面板 ================= */
        .time-weather-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 16px 26px;
            max-height: 200px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease, margin 0.35s ease, padding 0.35s ease;
        }

        body.is-searching .time-weather-panel {
            opacity: 0;
            max-height: 0;
            transform: translateY(-12px) scale(0.96);
            margin-top: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .tw-line-1 {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #timeClock {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .tw-line-2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0.92;
        }

        #weatherLocation { opacity: 0.8; }
        #weatherCurrent .w-temp { font-weight: 600; color: #fff; }
        #weatherForecast { opacity: 0.78; }
        #weatherForecast .fc-item { margin: 0 4px; white-space: nowrap; }
        .jieqi { color: #88b0ff; font-weight: 500; }

        .weather-loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0.6;
            font-size: 13px;
        }

        .weather-pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #88b0ff;
            animation: weatherPulse 1.1s ease-in-out infinite;
        }

        @keyframes weatherPulse {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            .time-weather-panel { padding: 12px 16px; margin-top: 14px; }
            #timeClock { font-size: 17px; }
            .tw-line-1, .tw-line-2 { font-size: 12.5px; }
        }

        /* ================= 每日一句（logo 下方 / 搜索框上方） ================= */
        .daily-quote-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 22px;
            padding: 14px 42px;
            max-width: 560px;
            max-height: 180px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            text-align: center;
            overflow: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease, border 0.4s ease;
        }

        /* 搜索模式 / 用户关闭时：折叠淡出 */
        body.is-searching .daily-quote-panel,
        body.is-quote-hidden .daily-quote-panel {
            opacity: 0;
            max-height: 0;
            transform: translateY(-10px);
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            pointer-events: none;
        }

        .daily-quote-mark {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            line-height: 1;
            color: rgba(136, 176, 255, 0.55);
            user-select: none;
        }

        .daily-quote-text {
            font-family: 'Georgia', 'Songti SC', 'STSong', serif;
            font-size: 15px;
            line-height: 1.7;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.88);
            font-style: italic;
            text-shadow: 0 0 16px rgba(136, 176, 255, 0.12);
        }

        .daily-quote-author {
            font-size: 12.5px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
        }

        .daily-quote-close {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.35);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s;
        }

        .daily-quote-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        /* 关闭后的小恢复按钮 */
        .daily-quote-restore {
            display: none;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            margin-bottom: 22px;
            padding: 4px 12px;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s;
        }

        body.is-quote-hidden:not(.is-searching) .daily-quote-restore {
            display: inline-flex;
        }

        .daily-quote-restore:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(136, 176, 255, 0.4);
        }

        @media (max-width: 600px) {
            .daily-quote-panel {
                padding: 12px 32px;
                margin-bottom: 16px;
                max-width: 92%;
            }
            .daily-quote-text { font-size: 13.5px; }
            .daily-quote-author { font-size: 11.5px; }
            .daily-quote-mark { font-size: 18px; }
            .daily-quote-restore { margin-bottom: 16px; }
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff, #88b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(136, 176, 255, 0.3);
            transition: all 0.4s;
        }

        body.is-searching .logo {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .search-box.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3), 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            outline: none;
            padding: 8px 10px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            opacity: 0.8;
        }

        .search-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* 快捷方式 */
        .shortcuts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
            opacity: 1;
            transition: all 0.4s ease;
        }

        body.is-searching .shortcuts {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            height: 0;
            margin-top: 0;
            overflow: hidden;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
        }

        .shortcut-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .shortcut-item:hover .shortcut-icon {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
        }

        .shortcut-text {
            font-size: 13px;
        }

        /* ================= 搜索结果区域 ================= */
        .results-area {
            width: 100%;
            max-width: 600px;
            margin-top: 30px;
            opacity: 1;
            pointer-events: none;
            overflow-y: auto;
            max-height: calc(100vh - 220px);
            padding-right: 10px;
        }

        body.is-searching .results-area {
            pointer-events: auto;
        }

        .results-area::-webkit-scrollbar { width: 6px; }
        .results-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s, visibility 0s;
        }

        .result-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .result-title {
            color: #64b5f6;
            font-size: 18px;
            margin-bottom: 5px;
            text-decoration: none;
            display: block;
        }

        .result-title:hover { text-decoration: underline; }

        .result-url {
            color: #4caf50;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .result-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            line-height: 1.5;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            font-size: 14px;
        }

        body.is-searching .back-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .warp-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(5,5,16,0.6) 100%);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body.is-warping .warp-mask { opacity: 1; }

        .flying-star {
            position: fixed;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 15px 3px #fff, 0 0 30px 6px #88b0ff, 0 0 50px 12px rgba(136, 176, 255, 0.6);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
        }
    </style>

    <script>
        /* ==========================================
           1. 星空粒子引擎
           ========================================== */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 800;
        const speed = { idle: 0.5, prepare: 4, warp: 60 };
        let currentState = 'idle';
        let currentSpeed = speed.idle;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = Math.random() * width;
                this.color = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`;
                this.size = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.z -= currentSpeed;
                if (this.z <= 0) { this.reset(); this.z = width; }
            }
            draw() {
                const screenX = (this.x / this.z) * (width / 2) + width / 2;
                const screenY = (this.y / this.z) * (height / 2) + height / 2;
                const scale = (1 - this.z / width) * this.size * 3;
                if (scale > 0.1) {
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, scale, 0, Math.PI * 2);
                    if (currentState === 'warp') {
                        ctx.fillStyle = `rgba(150, 200, 255, ${Math.max(0, 1 - this.z / width)})`;
                    } else {
                        ctx.fillStyle = this.color;
                    }
                    ctx.fill();
                }
            }
        }

        for (let i = 0; i < numStars; i++) stars.push(new Star());

        function animate() {
            ctx.fillStyle = currentState === 'warp' ? 'rgba(5, 5, 16, 0.1)' : 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, width, height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(animate);
        }
        animate();


        /* ==========================================
           2. UI 交互与卡片化流星
           ========================================== */
        const body = document.body;
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const backBtn = document.getElementById('backBtn');
        let searchToken = 0;

        /* ==========================================
           3. 每日一句模块
           ========================================== */
        const DAILY_QUOTE_STORAGE_KEY = 'st_nav_daily_quote_enabled';

        const QUOTES = [
            // ---- 诗词 ----
            { text: '人生若只如初见，何事秋风悲画扇。', author: '纳兰性德《木兰花令》' },
            { text: '山有木兮木有枝，心悦君兮君不知。', author: '《越人歌》' },
            { text: '落霞与孤鹜齐飞，秋水共长天一色。', author: '王勃《滕王阁序》' },
            { text: '海上生明月，天涯共此时。', author: '张九龄《望月怀远》' },
            { text: '此情可待成追忆，只是当时已惘然。', author: '李商隐《锦瑟》' },
            { text: '天生我材必有用，千金散尽还复来。', author: '李白《将进酒》' },
            { text: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。', author: '苏轼《定风波》' },
            { text: '众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。', author: '辛弃疾《青玉案·元夕》' },
            { text: '长风破浪会有时，直挂云帆济沧海。', author: '李白《行路难》' },
            { text: '大江东去，浪淘尽，千古风流人物。', author: '苏轼《念奴娇·赤壁怀古》' },
            { text: '会当凌绝顶，一览众山小。', author: '杜甫《望岳》' },
            { text: '采菊东篱下，悠然见南山。', author: '陶渊明《饮酒·其五》' },
            { text: '春江潮水连海平，海上明月共潮生。', author: '张若虚《春江花月夜》' },
            { text: '无可奈何花落去，似曾相识燕归来。', author: '晏殊《浣溪沙》' },
            { text: '衣带渐宽终不悔，为伊消得人憔悴。', author: '柳永《蝶恋花》' },
            { text: '问渠那得清如许？为有源头活水来。', author: '朱熹《观书有感》' },
            { text: '山重水复疑无路，柳暗花明又一村。', author: '陆游《游山西村》' },
            { text: '千里之行，始于足下。', author: '老子《道德经》' },
            { text: '不积跬步，无以至千里；不积小流，无以成江海。', author: '荀子《劝学》' },
            { text: '知之为知之，不知为不知，是知也。', author: '孔子《论语》' },

            // ---- 名言 ----
            { text: '我思故我在。', author: '笛卡尔' },
            { text: '人是一根会思想的芦苇。', author: '帕斯卡' },
            { text: '世上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱生活。', author: '罗曼·罗兰' },
            { text: '纵有疾风起，人生不言弃。', author: '保罗·瓦雷里' },
            { text: '我有一壶酒，足以慰风尘。', author: '佚名' },
            { text: '你是人间四月天。', author: '林徽因' },
            { text: '你若盛开，清风自来。', author: '佚名' },
            { text: '万物皆有裂痕，那是光照进来的地方。', author: '莱昂纳德·科恩' },
            { text: '把日子过成诗，把生活绘成画。', author: '佚名' },
            { text: '生活不止眼前的苟且，还有诗和远方。', author: '高晓松' },

            // ---- 治愈短句 ----
            { text: '你走的每一步，都在向着更好的自己靠近。', author: '每日一句' },
            { text: '慢慢来，比较快。', author: '每日一句' },
            { text: '星光不问赶路人，时光不负有心人。', author: '每日一句' },
            { text: '愿你走出半生，归来仍是少年。', author: '每日一句' },
            { text: '今天的风很温柔，像你的微笑。', author: '每日一句' },
            { text: '不论你在什么时候开始，重要的是开始之后就不要停止。', author: '每日一句' },
            { text: '生活明朗，万物可爱。', author: '每日一句' },
            { text: '不要着急，最好的总会在最不经意的时候出现。', author: '每日一句' },
            { text: '愿你所遇皆良善，所行皆坦途。', author: '每日一句' },
            { text: '夜色难免黑凉，前行必有曙光。', author: '每日一句' }
        ];

        const dailyQuoteText = document.getElementById('dailyQuoteText');
        const dailyQuoteAuthor = document.getElementById('dailyQuoteAuthor');
        const dailyQuoteClose = document.getElementById('dailyQuoteClose');
        const dailyQuoteRestore = document.getElementById('dailyQuoteRestore');

        // 基于日期的字符串哈希：保证同一天固定同一句，不同天分布均匀
        function hashDateStr(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = (h * 31 + str.charCodeAt(i)) >>> 0;
            }
            return h;
        }

        let lastQuoteDateKey = '';

        function renderDailyQuoteIfNeeded() {
            const now = new Date();
            const dateKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            if (dateKey === lastQuoteDateKey) return;
            lastQuoteDateKey = dateKey;

            const seed = hashDateStr(dateKey);
            const quote = QUOTES[seed % QUOTES.length];
            dailyQuoteText.textContent = quote.text;
            dailyQuoteAuthor.textContent = `—— ${quote.author}`;
        }

        function getQuoteEnabled() {
            try {
                const v = localStorage.getItem(DAILY_QUOTE_STORAGE_KEY);
                return v === null ? true : v === '1';
            } catch (e) {
                return true;
            }
        }

        function setQuoteEnabled(enabled) {
            try {
                localStorage.setItem(DAILY_QUOTE_STORAGE_KEY, enabled ? '1' : '0');
            } catch (e) {}
            body.classList.toggle('is-quote-hidden', !enabled);
        }

        renderDailyQuoteIfNeeded();
        body.classList.toggle('is-quote-hidden', !getQuoteEnabled());

        dailyQuoteClose.addEventListener('click', () => setQuoteEnabled(false));
        dailyQuoteRestore.addEventListener('click', () => setQuoteEnabled(true));

        // 跨日自动换句（每分钟检查一次，几乎零成本）
        setInterval(renderDailyQuoteIfNeeded, 60 * 1000);

        /* ==========================================
           4. 时间 + 农历模块
           ========================================== */
        const timeClock = document.getElementById('timeClock');
        const dateGregorian = document.getElementById('dateGregorian');
        const dateWeekday = document.getElementById('dateWeekday');
        const dateLunar = document.getElementById('dateLunar');

        const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        function pad2(n) { return String(n).padStart(2, '0'); }
        function weekdayOf(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return WEEK[d.getDay()];
        }

        function updateClockAndLunar() {
            const now = new Date();
            timeClock.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
            dateGregorian.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            dateWeekday.textContent = WEEK[now.getDay()];
            try {
                if (typeof Solar !== 'undefined') {
                    const lunar = Solar.fromYmd(now.getFullYear(), now.getMonth() + 1, now.getDate()).getLunar();
                    let txt = `农历 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    const jq = lunar.getJieQi();
                    if (jq) txt += ` · <span class="jieqi">${jq}</span>`;
                    dateLunar.innerHTML = txt;
                } else {
                    dateLunar.textContent = '农历 --';
                }
            } catch (e) {
                dateLunar.textContent = '农历 --';
            }
        }
        updateClockAndLunar();
        setInterval(updateClockAndLunar, 1000);

        /* ==========================================
           5. 天气模块（Open-Meteo 为主，wttr.in 降级）
           ========================================== */
        const weatherLocation = document.getElementById('weatherLocation');
        const weatherCurrent = document.getElementById('weatherCurrent');
        const weatherForecast = document.getElementById('weatherForecast');

        const WEATHER_CACHE_KEY = 'st_nav_weather_cache_v1';
        const WEATHER_TTL = 10 * 60 * 1000;

        const WMO = {
            0: ['☀️', '晴'], 1: ['🌤️', '晴间多云'], 2: ['⛅', '多云'], 3: ['☁️', '阴'],
            45: ['🌫️', '雾'], 48: ['🌫️', '雾凇'],
            51: ['🌦️', '毛毛雨'], 53: ['🌦️', '毛毛雨'], 55: ['🌦️', '毛毛雨'],
            56: ['🌧️', '冻雨'], 57: ['🌧️', '冻雨'],
            61: ['🌧️', '小雨'], 63: ['🌧️', '中雨'], 65: ['🌧️', '大雨'],
            66: ['🌧️', '冻雨'], 67: ['🌧️', '冻雨'],
            71: ['🌨️', '小雪'], 73: ['🌨️', '中雪'], 75: ['🌨️', '大雪'], 77: ['❄️', '雪粒'],
            80: ['🌦️', '阵雨'], 81: ['🌦️', '阵雨'], 82: ['⛈️', '强阵雨'],
            85: ['🌨️', '阵雪'], 86: ['🌨️', '强阵雪'],
            95: ['⛈️', '雷阵雨'], 96: ['⛈️', '雷阵雨伴雹'], 99: ['⛈️', '强雷暴伴雹']
        };
        function wmo(code) { return WMO[code] || ['🌡️', '未知']; }

        function showWeatherLoading() {
            weatherCurrent.innerHTML = '<span class="weather-loading"><span class="weather-pulse"></span>天气加载中</span>';
            weatherForecast.textContent = '';
        }

        function renderWeather(data) {
            weatherLocation.textContent = `📍 ${data.city}`;
            const c = data.current;
            const [emoji, desc] = wmo(c.code);
            weatherCurrent.innerHTML = `<span class="w-temp">${Math.round(c.temp)}°C</span> ${emoji} ${desc} 体感 ${Math.round(c.feels)}°C`;
            weatherForecast.innerHTML = data.daily.map(d =>
                `<span class="fc-item">${d.label} ${wmo(d.code)[0]} ${Math.round(d.tmax)}°/${Math.round(d.tmin)}°</span>`
            ).join('');
        }

        async function fetchWeatherOpenMeteo(lat, lon, city) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,apparent_temperature,weather_code` +
                `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
                `&timezone=auto&forecast_days=4`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('open-meteo ' + r.status);
            const j = await r.json();
            const cur = j.current;
            const labels = ['明天', '后天', weekdayOf(j.daily.time[3])];
            const daily = [1, 2, 3].map((i, idx) => ({
                label: labels[idx],
                code: j.daily.weather_code[i],
                tmax: j.daily.temperature_2m_max[i],
                tmin: j.daily.temperature_2m_min[i]
            }));
            return {
                city: city || '当地',
                current: { temp: cur.temperature_2m, feels: cur.apparent_temperature, code: cur.weather_code },
                daily
            };
        }

        async function fetchWeatherWttr(lat, lon, city) {
            const url = `https://wttr.in/${lat},${lon}?format=j1`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('wttr ' + r.status);
            const j = await r.json();
            const cur = j.current_condition[0];
            const labels = ['明天', '后天', weekdayOf(j.weather[2].date)];
            const daily = j.weather.slice(1, 4).map((d, idx) => ({
                label: labels[idx],
                code: parseInt(d.hourly[4].weatherCode, 10),
                tmax: parseFloat(d.maxtempC),
                tmin: parseFloat(d.mintempC)
            }));
            return {
                city: city || '当地',
                current: { temp: parseFloat(cur.tempC), feels: parseFloat(cur.FeelsLikeC), code: parseInt(cur.weatherCode, 10) },
                daily
            };
        }

        async function reverseGeocode(lat, lon) {
            try {
                const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
                if (!r.ok) return '';
                const j = await r.json();
                return j.city || j.locality || j.principalSubdivision || '';
            } catch (e) { return ''; }
        }

        async function locate() {
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000, maximumAge: 600000 });
                });
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                const city = await reverseGeocode(lat, lon);
                return { lat, lon, city };
            } catch (e) {
                try {
                    const r = await fetch('https://ipapi.co/json/');
                    if (r.ok) {
                        const j = await r.json();
                        if (typeof j.latitude === 'number') {
                            return { lat: j.latitude, lon: j.longitude, city: j.city || j.region || '' };
                        }
                    }
                } catch (e2) {}
            }
            return null;
        }

        async function loadWeather() {
            try {
                const raw = localStorage.getItem(WEATHER_CACHE_KEY);
                if (raw) {
                    const cached = JSON.parse(raw);
                    if (Date.now() - cached.ts < WEATHER_TTL) {
                        renderWeather(cached.data);
                        return;
                    }
                }
            } catch (e) {}

            showWeatherLoading();

            const loc = await locate();
            if (!loc) {
                weatherLocation.textContent = '📍 定位不可用';
                weatherCurrent.textContent = '天气暂不可用';
                return;
            }

            let data = null;
            try {
                data = await fetchWeatherOpenMeteo(loc.lat, loc.lon, loc.city);
            } catch (e) {
                try { data = await fetchWeatherWttr(loc.lat, loc.lon, loc.city); } catch (e2) {}
            }

            if (!data) {
                weatherCurrent.textContent = '天气暂不可用';
                weatherForecast.textContent = '';
                return;
            }

            renderWeather(data);
            try {
                localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
            } catch (e) {}
        }

        loadWeather();

        /* ==========================================
           6. 搜索与动画
           ========================================== */
        searchInput.addEventListener('focus', () => {
            if (currentState === 'idle') {
                currentState = 'prepare';
                currentSpeed = speed.prepare;
                searchBox.classList.add('active');
            }
        });

        searchInput.addEventListener('blur', () => {
            if (currentState === 'prepare') {
                currentState = 'idle';
                currentSpeed = speed.idle;
                searchBox.classList.remove('active');
            }
        });

        function triggerSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const currentToken = ++searchToken;

            currentState = 'warp';
            currentSpeed = speed.warp;
            searchInput.blur();
            body.classList.add('is-warping');
            body.classList.add('is-searching');

            const mockData = [
                { title: `百度搜索：${query}`, url: `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, desc: `通过百度搜索“${query}”的相关网页、新闻、视频与知道内容...` },
                { title: `必应搜索：${query}`, url: `https://www.bing.com/search?q=${encodeURIComponent(query)}`, desc: `使用微软必应搜索“${query}”，获取全球网页、图片与资讯结果...` },
                { title: `Google 搜索：${query}`, url: `https://www.google.com/search?q=${encodeURIComponent(query)}`, desc: `在 Google 中搜索“${query}”，查看来自全球的网页、新闻与知识面板...` },
                { title: `${query} - 维基百科，自由的百科全书`, url: `https://zh.wikipedia.org/wiki/${encodeURIComponent(query)}`, desc: `关于 ${query} 的详细百科介绍...` },
                { title: `如何评价/使用 ${query}？ - 知乎`, url: `https://www.zhihu.com/search?q=${encodeURIComponent(query)}&type=content`, desc: `知乎用户关于 ${query} 的热门讨论与经验分享...` }
            ];

            resultsContainer.innerHTML = mockData.map((item, index) => `
                <div class="result-item" id="res-card-${index}">
                    <a href="${item.url}" class="result-title" target="_blank">${item.title}</a>
                    <div class="result-url">${item.url}</div>
                    <div class="result-desc">${item.desc}</div>
                </div>
            `).join('');

            setTimeout(() => {
                if (currentToken !== searchToken) return;
                launchStarsToCards(currentToken);
            }, 400);
        }

        function launchStarsToCards(token) {
            const cards = document.querySelectorAll('.result-item');

            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const targetX = rect.left + rect.width / 2;
                const targetY = rect.top + rect.height / 2;

                setTimeout(() => {
                    if (token !== searchToken) return;

                    createFlyingStar(targetX, targetY, () => {
                        if (token !== searchToken) return;
                        card.style.visibility = 'visible';
                        void card.offsetWidth;
                        card.classList.add('visible');
                    });
                }, index * 180);
            });

            const totalTime = cards.length * 180 + 600;
            setTimeout(() => {
                if (token !== searchToken) return;
                currentState = 'idle';
                currentSpeed = speed.idle;
                body.classList.remove('is-warping');
            }, totalTime);
        }

        function createFlyingStar(targetX, targetY, onComplete) {
            const star = document.createElement('div');
            star.className = 'flying-star';
            document.body.appendChild(star);

            const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
            const startY = window.innerHeight * 0.6 + (Math.random() - 0.5) * 200;

            star.style.left = `${startX}px`;
            star.style.top = `${startY}px`;

            const deltaX = targetX - startX;
            const deltaY = targetY - startY;

            const animation = star.animate([
                { transform: `translate(0, 0) scale(0.1)`, opacity: 0 },
                { transform: `translate(${deltaX * 0.2}px, ${deltaY * 0.2}px) scale(1.5)`, opacity: 1, offset: 0.2 },
                { transform: `translate(${deltaX}px, ${deltaY}px) scale(0.8)`, opacity: 0.8 }
            ], {
                duration: 500,
                easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => {
                star.remove();
                if (onComplete) onComplete();
            };
        }

        searchBtn.addEventListener('click', triggerSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerSearch();
        });

        backBtn.addEventListener('click', () => {
            searchToken++;
            body.classList.remove('is-searching');
            searchInput.value = '';
            currentState = 'idle';
            currentSpeed = speed.idle;

            document.querySelectorAll('.flying-star').forEach(el => el.remove());

            setTimeout(() => {
                resultsContainer.innerHTML = '';
            }, 400);
        });
    </script>
