<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ST导航 - 星空搜索</title>
    <style>
        /* ================= 基础样式 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        :root { --bg-rgb: 5, 5, 16; }
        body[data-bg="deepspace"] { --bg-rgb: 5, 5, 16; }
        body[data-bg="aurora"]    { --bg-rgb: 4, 18, 26; }
        body[data-bg="nebula"]    { --bg-rgb: 12, 6, 24; }
        body[data-bg="deepsea"]   { --bg-rgb: 3, 12, 28; }
        body[data-bg="solid"]     { --bg-rgb: 0, 0, 0; }

        body {
            background-color: rgb(var(--bg-rgb));
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: background-color 0.6s ease;
        }

        /* ================= 背景层 ================= */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        body[data-bg="deepspace"] .bg-layer::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, rgba(40, 55, 120, 0.28), transparent 70%);
        }

        body[data-bg="aurora"] .bg-layer::before {
            content: "";
            position: absolute;
            inset: -25%;
            background:
                radial-gradient(38% 28% at 28% 22%, rgba(0, 255, 190, 0.20), transparent 70%),
                radial-gradient(42% 32% at 72% 28%, rgba(0, 150, 255, 0.18), transparent 70%),
                radial-gradient(48% 38% at 50% 72%, rgba(150, 80, 255, 0.14), transparent 70%);
            filter: blur(50px);
            animation: auroraShift 22s ease-in-out infinite alternate;
        }
        @keyframes auroraShift {
            0%   { transform: translate(-4%, -2%) scale(1); }
            50%  { transform: translate(3%, 2%) scale(1.08); }
            100% { transform: translate(-2%, 4%) scale(1.03); }
        }

        body[data-bg="nebula"] .bg-layer::before {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(45% 35% at 30% 30%, rgba(180, 80, 255, 0.20), transparent 70%),
                radial-gradient(40% 30% at 70% 60%, rgba(255, 80, 150, 0.15), transparent 70%),
                radial-gradient(50% 40% at 55% 20%, rgba(80, 140, 255, 0.15), transparent 70%);
            filter: blur(60px);
            animation: nebulaShift 28s ease-in-out infinite alternate;
        }
        @keyframes nebulaShift {
            0%   { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(8deg) scale(1.1); }
        }

        body[data-bg="deepsea"] .bg-layer::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0, 90, 150, 0.35) 0%, transparent 45%, rgba(0, 20, 60, 0.55) 100%),
                radial-gradient(60% 40% at 50% 0%, rgba(0, 180, 255, 0.18), transparent 70%);
        }

        /* ================= 左上角毛玻璃返回按钮 ================= */
        .back-home-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            cursor: pointer;
        }

        .back-home-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            opacity: 0.7;
            pointer-events: none;
        }

        .back-home-btn::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(136,176,255,0.25), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }
        .back-home-btn:hover::after { left: 100%; }

        .back-home-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(136, 176, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 20px rgba(136, 176, 255, 0.35);
            transform: translateY(-2px);
        }
        .back-home-btn:active { transform: translateY(0); }
        .back-home-btn svg { transition: transform 0.35s ease; flex-shrink: 0; }
        .back-home-btn:hover svg { transform: translateX(-4px); }

        @media (max-width: 600px) {
            .back-home-btn { top: 16px; left: 16px; padding: 8px 14px; font-size: 13px; }
        }

        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ================= 主容器 ================= */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            justify-content: center;
            padding: 20px;
        }

        body.is-searching .main-container {
            justify-content: flex-start;
            padding-top: 40px;
        }

        /* ================= 头部区域 ================= */
        .header-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* ================= 模块包装（拖拽偏移载体） ================= */
        .mod-wrap {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.35s ease;
        }

        .mod-wrap.dragging { transition: none; }

        .mod-drag-handle {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            line-height: 1;
            cursor: grab;
            opacity: 0;
            z-index: 30;
            transition: opacity 0.2s, background 0.2s;
            touch-action: none;
        }
        .mod-wrap:hover .mod-drag-handle { opacity: 1; }
        .mod-drag-handle:hover { background: rgba(136, 176, 255, 0.28); color: #fff; }
        .mod-drag-handle:active { cursor: grabbing; }

        @media (hover: none) {
            .mod-drag-handle { opacity: 0.5; }
        }

        /* ================= 时间与天气面板 ================= */
        .time-weather-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 16px 26px;
            max-height: 200px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            transition: opacity 0.35s ease, transform 0.35s ease, max-height 0.35s ease, margin 0.35s ease, padding 0.35s ease;
        }

        body.is-searching .time-weather-panel {
            opacity: 0;
            max-height: 0;
            transform: translateY(-12px) scale(0.96);
            margin-top: 0;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .tw-line-1 {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #timeClock {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .tw-line-2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0.92;
        }

        #weatherLocation { opacity: 0.8; }
        #weatherCurrent .w-temp { font-weight: 600; color: #fff; }
        #weatherForecast { opacity: 0.78; }
        #weatherForecast .fc-item { margin: 0 4px; white-space: nowrap; }
        .jieqi { color: #88b0ff; font-weight: 500; }

        .weather-loading {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0.6;
            font-size: 13px;
        }

        .weather-pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #88b0ff;
            animation: weatherPulse 1.1s ease-in-out infinite;
        }

        @keyframes weatherPulse {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            .time-weather-panel { padding: 12px 16px; margin-top: 14px; }
            #timeClock { font-size: 17px; }
            .tw-line-1, .tw-line-2 { font-size: 12.5px; }
        }

        /* ================= 每日一句 ================= */
        .daily-quote-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 22px;
            padding: 14px 42px;
            max-width: 560px;
            max-height: 180px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            text-align: center;
            overflow: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease, margin 0.4s ease, padding 0.4s ease, border 0.4s ease;
        }

        body.is-searching .daily-quote-panel,
        body.is-quote-hidden .daily-quote-panel {
            opacity: 0;
            max-height: 0;
            transform: translateY(-10px);
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            pointer-events: none;
        }

        .daily-quote-mark {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            line-height: 1;
            color: rgba(136, 176, 255, 0.55);
            user-select: none;
        }

        .daily-quote-text {
            font-family: 'Georgia', 'Songti SC', 'STSong', serif;
            font-size: 15px;
            line-height: 1.7;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.88);
            font-style: italic;
            text-shadow: 0 0 16px rgba(136, 176, 255, 0.12);
        }

        .daily-quote-author {
            font-size: 12.5px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
        }

        .daily-quote-close {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.35);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            transition: all 0.2s;
        }
        .daily-quote-close:hover { color: #fff; background: rgba(255, 255, 255, 0.12); }

        .daily-quote-restore {
            display: none;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            margin-bottom: 22px;
            padding: 4px 12px;
            font-size: 12px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s;
        }

        body.is-quote-hidden:not(.is-searching) .daily-quote-restore { display: inline-flex; }

        .daily-quote-restore:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(136, 176, 255, 0.4);
        }

        @media (max-width: 600px) {
            .daily-quote-panel { padding: 12px 32px; margin-bottom: 16px; max-width: 92%; }
            .daily-quote-text { font-size: 13.5px; }
            .daily-quote-author { font-size: 11.5px; }
            .daily-quote-mark { font-size: 18px; }
            .daily-quote-restore { margin-bottom: 16px; }
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff, #88b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(136, 176, 255, 0.3);
            transition: all 0.4s;
        }

        body.is-searching .logo {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .search-box.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3), 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            outline: none;
            padding: 8px 10px;
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        .search-btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            opacity: 0.8;
        }
        .search-btn:hover { opacity: 1; transform: scale(1.05); }

        /* 快捷方式 */
        .shortcuts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
            opacity: 1;
            transition: all 0.4s ease;
        }

        body.is-searching .shortcuts {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
            height: 0;
            margin-top: 0;
            overflow: hidden;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s;
            cursor: pointer;
            padding: 10px;
            border-radius: 12px;
        }

        .shortcut-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .shortcut-item:hover .shortcut-icon {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.4);
        }

        .shortcut-text { font-size: 13px; }

        /* ================= 搜索结果区域 ================= */
        .results-area {
            width: 100%;
            max-width: 600px;
            margin-top: 30px;
            opacity: 1;
            pointer-events: none;
            overflow-y: auto;
            max-height: calc(100vh - 220px);
            padding-right: 10px;
        }

        body.is-searching .results-area { pointer-events: auto; }

        .results-area::-webkit-scrollbar { width: 6px; }
        .results-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px) scale(0.95);
            visibility: hidden;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s, visibility 0s;
        }

        .result-item.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        .result-item:hover { background: rgba(255, 255, 255, 0.08); }

        .result-title {
            color: #64b5f6;
            font-size: 18px;
            margin-bottom: 5px;
            text-decoration: none;
            display: block;
        }
        .result-title:hover { text-decoration: underline; }

        .result-url { color: #4caf50; font-size: 13px; margin-bottom: 5px; }

        .result-desc { color: rgba(255, 255, 255, 0.6); font-size: 14px; line-height: 1.5; }

        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            font-size: 14px;
        }

        body.is-searching .back-btn { opacity: 1; pointer-events: auto; }
        .back-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .warp-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0, 0, 0, 0.55) 100%);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body.is-warping .warp-mask { opacity: 1; }

        .flying-star {
            position: fixed;
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 15px 3px #fff, 0 0 30px 6px #88b0ff, 0 0 50px 12px rgba(136, 176, 255, 0.6);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
        }

        /* ================= 布局模板 ================= */
        body[data-layout="top"]:not(.is-searching) .main-container {
            justify-content: flex-start;
            padding-top: 64px;
        }
        body[data-layout="top"] .logo {
            font-size: 34px;
            margin-bottom: 18px;
        }
        body[data-layout="top"] .time-weather-panel { margin-top: 12px; }
        body[data-layout="top"] .shortcuts { margin-top: 26px; }

        body[data-layout="split"] .header-area {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
            grid-template-areas:
                "logo      shortcuts"
                "quote     shortcuts"
                "search    weather";
            align-items: center;
            justify-items: center;
            gap: 16px 28px;
            width: 100%;
        }

        body[data-layout="split"] .mod-wrap[data-mod="logo"]      { grid-area: logo; }
        body[data-layout="split"] .mod-wrap[data-mod="quote"]     { grid-area: quote; }
        body[data-layout="split"] .mod-wrap[data-mod="search"]    { grid-area: search; }
        body[data-layout="split"] .mod-wrap[data-mod="shortcuts"] { grid-area: shortcuts; }
        body[data-layout="split"] .mod-wrap[data-mod="weather"]   { grid-area: weather; }

        body[data-layout="split"] .logo { font-size: 38px; margin-bottom: 10px; }
        body[data-layout="split"] .daily-quote-panel { margin-bottom: 8px; padding: 10px 26px; }
        body[data-layout="split"] .daily-quote-restore { margin-bottom: 8px; }
        body[data-layout="split"] .shortcuts { margin-top: 0; gap: 14px; }
        body[data-layout="split"] .time-weather-panel { margin-top: 0; padding: 12px 16px; }

        @media (max-width: 900px) {
            body[data-layout="split"] .header-area {
                display: flex;
                flex-direction: column;
                gap: 0;
            }
        }

        /* ================= 专注模式 ================= */
        body.focus-mode .mod-wrap[data-mod="logo"],
        body.focus-mode .mod-wrap[data-mod="quote"],
        body.focus-mode .mod-wrap[data-mod="shortcuts"],
        body.focus-mode .mod-wrap[data-mod="weather"] {
            opacity: 0 !important;
            pointer-events: none !important;
            position: absolute !important;
            width: 0 !important;
            height: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body.focus-mode .main-container { justify-content: center; padding-top: 20px; }

        /* ================= 角落按钮 ================= */
        .corner-actions {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 9500;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .corner-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            border-radius: 999px;

    <script>
        /* ==========================================
           0. 设置存储与常量
           ========================================== */
        const SETTINGS_KEY = 'st_nav_settings_v2';
        const PRESETS_KEY = 'st_nav_presets_v2';
        const FOCUS_KEY = 'st_nav_focus_mode';

        const DEFAULT_SETTINGS = {
            starCount: 800,
            starColor: '#ffffff',
            warpSpeed: 1,
            meteorInterval: 180,
            bgStyle: 'deepspace',
            layout: 'center',
            offsets: {}
        };

        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
                const parsed = JSON.parse(raw);
                return Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), parsed, {
                    offsets: parsed.offsets || {}
                });
            } catch (e) {
                return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
            }
        }

        function saveSettings() {
            try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
        }

        let settings = loadSettings();

        function loadPresets() {
            try {
                return JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}');
            } catch (e) { return {}; }
        }
        function savePresets(p) {
            try { localStorage.setItem(PRESETS_KEY, JSON.stringify(p)); } catch (e) {}
        }

        function hexToRgb(hex) {
            const h = String(hex || '#ffffff').replace('#', '');
            const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h.padEnd(6, '0').slice(0, 6);
            return {
                r: parseInt(full.slice(0, 2), 16) || 0,
                g: parseInt(full.slice(2, 4), 16) || 0,
                b: parseInt(full.slice(4, 6), 16) || 0
            };
        }

        let starBaseRgb = hexToRgb(settings.starColor);

        /* ==========================================
           1. 星空粒子引擎
           ========================================== */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const SPEEDS = { idle: 0.5, prepare: 4, warp: 60 };
        let currentState = 'idle';
        let currentSpeed = SPEEDS.idle;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width * 3;
                this.y = (Math.random() - 0.5) * height * 3;
                this.z = Math.random() * width;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.size = Math.random() * 1.5 + 0.5;
            }
            update() {
                this.z -= currentSpeed;
                if (this.z <= 0) { this.reset(); this.z = width; }
            }
            draw() {
                const screenX = (this.x / this.z) * (width / 2) + width / 2;
                const screenY = (this.y / this.z) * (height / 2) + height / 2;
                const scale = (1 - this.z / width) * this.size * 3;
                if (scale > 0.1) {
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, scale, 0, Math.PI * 2);
                    if (currentState === 'warp') {
                        const t = Math.max(0, 1 - this.z / width);
                        ctx.fillStyle = `rgba(150, 200, 255, ${t})`;
                    } else {
                        ctx.fillStyle = `rgba(${starBaseRgb.r}, ${starBaseRgb.g}, ${starBaseRgb.b}, ${this.alpha})`;
                    }
                    ctx.fill();
                }
            }
        }

        function syncStarCount() {
            const target = Math.max(10, Math.round(settings.starCount));
            while (stars.length < target) stars.push(new Star());
            while (stars.length > target) stars.pop();
        }
        syncStarCount();

        function animate() {
            // destination-out 淡出：保持 Canvas 透明，让底层背景风格可见
            const fade = currentState === 'warp' ? 0.09 : 0.26;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';

            currentSpeed = currentState === 'warp'
                ? SPEEDS.warp * settings.warpSpeed
                : currentState === 'prepare' ? SPEEDS.prepare : SPEEDS.idle;

            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();


        /* ==========================================
           2. UI 基础引用
           ========================================== */
        const body = document.body;
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const backBtn = document.getElementById('backBtn');
        let searchToken = 0;

        /* ==========================================
           3. 每日一句模块
           ========================================== */
        const DAILY_QUOTE_STORAGE_KEY = 'st_nav_daily_quote_enabled';

        const QUOTES = [
            { text: '人生若只如初见，何事秋风悲画扇。', author: '纳兰性德《木兰花令》' },
            { text: '山有木兮木有枝，心悦君兮君不知。', author: '《越人歌》' },
            { text: '落霞与孤鹜齐飞，秋水共长天一色。', author: '王勃《滕王阁序》' },
            { text: '海上生明月，天涯共此时。', author: '张九龄《望月怀远》' },

        function hashDateStr(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
            return h;
        }

            lastQuoteDateKey = dateKey;

            const quote = QUOTES[seed % QUOTES.length];
            dailyQuoteText.textContent = quote.text;

        }

        const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        function pad2(n) { return String(n).padStart(2, '0'); }
        function weekdayOf(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return WEEK[d.getDay()];
        }

        function updateClockAndLunar() {
            const now = new Date();
            timeClock.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
            dateGregorian.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
            dateWeekday.textContent = WEEK[now.getDay()];
            try {
                if (typeof Solar !== 'undefined') {
                    const lunar = Solar.fromYmd(now.getFullYear(), now.getMonth() + 1, now.getDate()).getLunar();
                    let txt = `农历 ${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    const jq = lunar.getJieQi();
                    if (jq) txt += ` · <span class="jieqi">${jq}</span>`;
                    dateLunar.innerHTML = txt;
                } else {
                    dateLunar.textContent = '农历 --';
                }
            } catch (e) {
                dateLunar.textContent = '农历 --';
            }
        }

        function renderWeather(data) {
            weatherLocation.textContent = `📍 ${data.city}`;
            const c = data.current;
            const [emoji, desc] = wmo(c.code);
            weatherCurrent.innerHTML = `<span class="w-temp">${Math.round(c.temp)}°C</span> ${emoji} ${desc} 体感 ${Math.round(c.feels)}°C`;
            weatherForecast.innerHTML = data.daily.map(d =>
                `<span class="fc-item">${d.label} ${wmo(d.code)[0]} ${Math.round(d.tmax)}°/${Math.round(d.tmin)}°</span>`

        async function fetchWeatherOpenMeteo(lat, lon, city) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,apparent_temperature,weather_code` +
                `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
                `&timezone=auto&forecast_days=4`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('open-meteo ' + r.status);
            const j = await r.json();
            const cur = j.current;
            const labels = ['明天', '后天', weekdayOf(j.daily.time[3])];
            const daily = [1, 2, 3].map((i, idx) => ({
                label: labels[idx],
                code: j.daily.weather_code[i],
                tmax: j.daily.temperature_2m_max[i],
                tmin: j.daily.temperature_2m_min[i]
            }));
            return {
                city: city || '当地',
                current: { temp: cur.temperature_2m, feels: cur.apparent_temperature, code: cur.weather_code },
                daily
            };
        }

        async function fetchWeatherWttr(lat, lon, city) {
            const url = `https://wttr.in/${lat},${lon}?format=j1`;
            const r = await fetch(url);
            if (!r.ok) throw new Error('wttr ' + r.status);
            const j = await r.json();
            const cur = j.current_condition[0];
            const labels = ['明天', '后天', weekdayOf(j.weather[2].date)];
            const daily = j.weather.slice(1, 4).map((d, idx) => ({
                label: labels[idx],
                code: parseInt(d.hourly[4].weatherCode, 10),
                tmax: parseFloat(d.maxtempC),
                tmin: parseFloat(d.mintempC)
            }));
            return {
                city: city || '当地',
                current: { temp: parseFloat(cur.tempC), feels: parseFloat(cur.FeelsLikeC), code: parseInt(cur.weatherCode, 10) },
                daily
            };
        }

        async function reverseGeocode(lat, lon) {
            try {
                const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
                if (!r.ok) return '';
                const j = await r.json();
                return j.city || j.locality || j.principalSubdivision || '';
            } catch (e) { return ''; }
        }

        async function locate() {
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000, maximumAge: 600000 });
                });
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                const city = await reverseGeocode(lat, lon);
                return { lat, lon, city };
            } catch (e) {
                try {
                    const r = await fetch('https://ipapi.co/json/');
                    if (r.ok) {
                        const j = await r.json();
                        if (typeof j.latitude === 'number') {
                            return { lat: j.latitude, lon: j.longitude, city: j.city || j.region || '' };
                        }
                    }
                } catch (e2) {}
            }
            return null;
        }

        async function loadWeather() {
            try {
                const raw = localStorage.getItem(WEATHER_CACHE_KEY);
                if (raw) {
                    const cached = JSON.parse(raw);
                    if (Date.now() - cached.ts < WEATHER_TTL) {
                        renderWeather(cached.data);
                        return;
                    }
                }
            } catch (e) {}

            showWeatherLoading();

            const loc = await locate();
            if (!loc) {
                weatherLocation.textContent = '📍 定位不可用';
                weatherCurrent.textContent = '天气暂不可用';
                return;
            }

            let data = null;
            try {
                data = await fetchWeatherOpenMeteo(loc.lat, loc.lon, loc.city);
            } catch (e) {
                try { data = await fetchWeatherWttr(loc.lat, loc.lon, loc.city); } catch (e2) {}
            }

            if (!data) {
                weatherCurrent.textContent = '天气暂不可用';
                weatherForecast.textContent = '';
                return;
            }

            renderWeather(data);
            try {
                localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ ts: Date.now(), data }));
            } catch (e) {}
        }

        loadWeather();

        function setupDragHandles() {
            document.querySelectorAll('.mod-wrap').forEach(wrap => {
                const key = wrap.dataset.mod;
                const handle = document.createElement('button');
                handle.type = 'button';
                handle.className = 'mod-drag-handle';
                handle.title = '拖动调整位置';
                handle.setAttribute('aria-label', '拖动调整位置');
                handle.textContent = '✥';
                wrap.appendChild(handle);

                let drag = null;

                handle.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    e.stopPropagation();
                    const off = (settings.offsets[key]) || { x: 0, y: 0 };
                    drag = {
                        startX: e.clientX,
                        startY: e.clientY,
                        baseX: off.x || 0,
                        baseY: off.y || 0
                    };
                    wrap.classList.add('dragging');
                    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
                });

                handle.addEventListener('pointermove', e => {
                    if (!drag) return;
                    const nx = drag.baseX + (e.clientX - drag.startX);
                    const ny = drag.baseY + (e.clientY - drag.startY);
                    settings.offsets[key] = { x: nx, y: ny };
                    wrap.style.transform = `translate(${nx}px, ${ny}px)`;
                });

                const end = e => {
                    if (!drag) return;
                    drag = null;
                    wrap.classList.remove('dragging');
                    try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
                    saveSettings();
                };

                handle.addEventListener('pointerup', end);
                handle.addEventListener('pointercancel', end);
            });
        }

                closeSettings();
            }
        });

        /* ==========================================
           10. 设置面板开关
           ========================================== */
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsFab = document.getElementById('settingsFab');

        function openSettings() {
            settingsPanel.classList.add('open');
            if (document.body.classList.contains('focus-mode')) setFocusMode(false, true);
        }
        function closeSettings() {
            settingsPanel.classList.remove('open');
        }

        settingsFab.addEventListener('click', () => {
            if (settingsPanel.classList.contains('open')) closeSettings();
            else openSettings();
        });
        document.getElementById('settingsClose').addEventListener('click', closeSettings);

        /* ==========================================
           11. 搜索与动画
           ========================================== */
        searchInput.addEventListener('focus', () => {
            if (currentState === 'idle') {
                currentState = 'prepare';
                searchBox.classList.add('active');
            }
        });

        searchInput.addEventListener('blur', () => {
            if (currentState === 'prepare') {
                currentState = 'idle';
                searchBox.classList.remove('active');
            }
        });

        function triggerSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            const currentToken = ++searchToken;

            currentState = 'warp';
            searchInput.blur();
            body.classList.add('is-warping');
            body.classList.add('is-searching');

            const mockData = [
                { title: `百度搜索：${query}`, url: `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`, desc: `通过百度搜索“${query}”的相关网页、新闻、视频与知道内容...` },
                { title: `必应搜索：${query}`, url: `https://www.bing.com/search?q=${encodeURIComponent(query)}`, desc: `使用微软必应搜索“${query}”，获取全球网页、图片与资讯结果...` },
                { title: `Google 搜索：${query}`, url: `https://www.google.com/search?q=${encodeURIComponent(query)}`, desc: `在 Google 中搜索“${query}”，查看来自全球的网页、新闻与知识面板...` },
                { title: `${query} - 维基百科，自由的百科全书`, url: `https://zh.wikipedia.org/wiki/${encodeURIComponent(query)}`, desc: `关于 ${query} 的详细百科介绍...` },
                { title: `如何评价/使用 ${query}？ - 知乎`, url: `https://www.zhihu.com/search?q=${encodeURIComponent(query)}&type=content`, desc: `知乎用户关于 ${query} 的热门讨论与经验分享...` }
            ];

            resultsContainer.innerHTML = mockData.map((item, index) => `
                <div class="result-item" id="res-card-${index}">
                    <a href="${item.url}" class="result-title" target="_blank">${item.title}</a>
                    <div class="result-url">${item.url}</div>
                    <div class="result-desc">${item.desc}</div>
                </div>
            `).join('');

            setTimeout(() => {
                if (currentToken !== searchToken) return;
                launchStarsToCards(currentToken);
            }, 400);
        }

        function launchStarsToCards(token) {
            const cards = document.querySelectorAll('.result-item');
            const gap = Math.max(40, settings.meteorInterval);

            cards.forEach((card, index) => {
                const rect = card.getBoundingClientRect();
                const targetX = rect.left + rect.width / 2;
                const targetY = rect.top + rect.height / 2;

                setTimeout(() => {
                    if (token !== searchToken) return;
                    createFlyingStar(targetX, targetY, () => {
                        if (token !== searchToken) return;
                        card.style.visibility = 'visible';
                        void card.offsetWidth;
                        card.classList.add('visible');
                    });
                }, index * gap);
            });

            const totalTime = cards.length * gap + 600;
            setTimeout(() => {
                if (token !== searchToken) return;
                currentState = 'idle';
                body.classList.remove('is-warping');
            }, totalTime);
        }

        function createFlyingStar(targetX, targetY, onComplete) {
            const star = document.createElement('div');
            star.className = 'flying-star';
            document.body.appendChild(star);

            const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
            const startY = window.innerHeight * 0.6 + (Math.random() - 0.5) * 200;

            star.style.left = `${startX}px`;
            star.style.top = `${startY}px`;

            const deltaX = targetX - startX;
            const deltaY = targetY - startY;

            const animation = star.animate([
                { transform: `translate(0, 0) scale(0.1)`, opacity: 0 },
                { transform: `translate(${deltaX * 0.2}px, ${deltaY * 0.2}px) scale(1.5)`, opacity: 1, offset: 0.2 },
                { transform: `translate(${deltaX}px, ${deltaY}px) scale(0.8)`, opacity: 0.8 }
            ], {
                duration: 500,
                easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
                fill: 'forwards'
            });

            animation.onfinish = () => {
                star.remove();
                if (onComplete) onComplete();
            };
        }

        searchBtn.addEventListener('click', triggerSearch);
        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') triggerSearch();
        });

        backBtn.addEventListener('click', () => {
            searchToken++;
            body.classList.remove('is-searching');
            searchInput.value = '';
            currentState = 'idle';
            document.querySelectorAll('.flying-star').forEach(el => el.remove());
            setTimeout(() => { resultsContainer.innerHTML = ''; }, 400);
        });

        /* ==========================================
           12. 启动
           ========================================== */
        setupDragHandles();
        applyAllSettings();
        colorPicker.value = settings.starColor;
    </script>
</body>
</html>
