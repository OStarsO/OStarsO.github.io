<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面迷失在星空中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg,
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #bg {
            z-index: 1;
        }

        #stars {
            z-index: 2;
        }

        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #fff;
            animation: fadeIn 2s ease-in-out;
        }

        .title-404 {
            font-size: 12rem;
            font-weight: bold;
            background: linear-gradient(45deg, #4fc3f7, #673ab7, #e91e63);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(103, 58, 183, 0.5),
                         0 0 40px rgba(79, 195, 247, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #ccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .home-btn {
            position: relative;
            overflow: hidden;
            padding: 15px 40px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #673ab7, #4fc3f7);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
            pointer-events: none;
        }

        .home-btn:hover::before {
            left: 100%;
        }

        .home-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(103, 58, 183, 0.6);
        }

        .loading-text {
            font-size: 0.9rem;
            color: #888;
            margin-top: 24px;
            letter-spacing: 1px;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .loading-text.hide {
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        @media (max-width: 768px) {
            .title-404 {
                font-size: 5rem;
            }
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <canvas id="stars"></canvas>

    <div class="container">
        <h1 class="title-404">404</h1>
        <p class="subtitle">页面迷失在浩瀚星空中</p>
        <a href="Introduction.html" class="home-btn">返回首页</a>
        <p class="loading-text" id="loadingText">正在星际定位失联页面...</p>
    </div>

    <script>
        const HOME_URL = 'pc.html';

        const bgCanvas = document.getElementById('bg');
        const bgCtx = bgCanvas.getContext('2d');

        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;

        let mouseX = W / 2;
        let mouseY = H / 2;

        const speed = 0.9;
        const gravityStrength = 0.08;

        const stars = [];
        const shootingStars = [];
        const burstParticles = [];

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;

            bgCanvas.width = W;
            bgCanvas.height = H;

            canvas.width = W;
            canvas.height = H;

            mouseX = W / 2;
            mouseY = H / 2;
        }

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(init = false) {
                this.x = random(-W, W);
                this.y = random(-H, H);
                this.z = init ? random(1, W) : W;
                this.origZ = this.z;

                const colors = [
                    '255, 255, 255',
                    '180, 220, 255',
                    '210, 180, 255',
                    '255, 230, 200'
                ];
                this.color = colors[Math.floor(random(0, colors.length))];
            }

            update() {
                this.z -= speed;

                if (this.z < 1) {
                    this.reset();
                    return;
                }

                const scale = W / this.z;

                let screenX = this.x * scale + W / 2;
                let screenY = this.y * scale + H / 2;

                const dx = mouseX - screenX;
                const dy = mouseY - screenY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 250) {
                    const force = (1 - dist / 250) * gravityStrength;
                    screenX += dx * force;
                    screenY += dy * force;
                }

                const radius = Math.min(scale * 2, 4);
                const brightness = 1 - (this.z / this.origZ) * 0.5;

                ctx.beginPath();
                ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${brightness})`;
                ctx.fill();
            }
        }

        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = random(0, W);
                this.y = random(-H * 0.2, H * 0.2);
                this.length = random(50, 150);
                this.speed = random(10, 20);
                this.angle = random(Math.PI / 6, Math.PI / 3);
                this.opacity = 1;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(
                    this.x + this.length * Math.cos(this.angle),
                    this.y + this.length * Math.sin(this.angle)
                );
                ctx.stroke();
                ctx.restore();
            }

            update() {
                this.x += this.speed * Math.cos(this.angle);
                this.y += this.speed * Math.sin(this.angle);
                this.opacity -= 0.015;

                if (this.opacity > 0) {
                    this.draw();
                }
            }
        }

        class BurstParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = random(-6, 6);
                this.vy = random(-6, 6);
                this.life = 1;
                this.size = random(1, 3);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
                this.vx *= 0.98;
                this.vy *= 0.98;

                if (this.life <= 0) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                ctx.fill();
            }
        }

        function drawNebula() {
            bgCtx.fillStyle = '#000';
            bgCtx.fillRect(0, 0, W, H);

            const r1 = Math.max(350, Math.min(W, H) * 0.45);
            const gradient1 = bgCtx.createRadialGradient(
                W * 0.2, H * 0.3, 0,
                W * 0.2, H * 0.3, r1
            );
            gradient1.addColorStop(0, 'rgba(103, 58, 183, 0.15)');
            gradient1.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = gradient1;
            bgCtx.fillRect(0, 0, W, H);

            const r2 = Math.max(400, Math.min(W, H) * 0.5);
            const gradient2 = bgCtx.createRadialGradient(
                W * 0.8, H * 0.7, 0,
                W * 0.8, H * 0.7, r2
            );
            gradient2.addColorStop(0, 'rgba(79, 195, 247, 0.12)');
            gradient2.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = gradient2;
            bgCtx.fillRect(0, 0, W, H);
        }

        // 已删除 drawPlanet 函数

        function drawBackground() {
            drawNebula();
            // 星球调用已移除
        }

        function buildStars() {
            stars.length = 0;
            const count = W <= 768 ? 200 : 600;

            for (let i = 0; i < count; i++) {
                stars.push(new Star());
            }
        }

        resize();
        buildStars();
        drawBackground();

        window.addEventListener('resize', () => {
            resize();
            buildStars();
        });

        window.addEventListener('pointermove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('click', (e) => {
            if (e.target.closest && e.target.closest('a, button')) return;

            for (let i = 0; i < 30; i++) {
                burstParticles.push(new BurstParticle(e.clientX, e.clientY));
            }
        });

        setInterval(() => {
            if (Math.random() > 0.97) {
                shootingStars.push(new ShootingStar());
            }
        }, 200);

        const loadingText = document.getElementById('loadingText');
        const tipTexts = [
            '正在星际定位失联页面...',
            '扫描深空信号...',
            '未找到目标坐标...'
        ];
        let tipIndex = 0;

        const tipTimer = setInterval(() => {
            tipIndex++;

            if (tipIndex >= tipTexts.length) {
                clearInterval(tipTimer);
                loadingText.classList.add('hide');
                return;
            }

            loadingText.textContent = tipTexts[tipIndex];
        }, 1400);

        const konamiCode = [
            'ArrowUp', 'ArrowUp',
            'ArrowDown', 'ArrowDown',
            'ArrowLeft', 'ArrowRight',
            'ArrowLeft', 'ArrowRight',
            'KeyB', 'KeyA'
        ];
        let konamiIndex = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === konamiCode[konamiIndex]) {
                konamiIndex++;

                if (konamiIndex === konamiCode.length) {
                    for (let i = 0; i < 20; i++) {
                        setTimeout(() => {
                            shootingStars.push(new ShootingStar());
                        }, i * 100);
                    }
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }

            const tag = document.activeElement && document.activeElement.tagName;
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;

            if (['Space', 'Enter', 'Escape'].includes(e.code)) {
                e.preventDefault();
                window.location.href = HOME_URL;
            }
        });

        function animate() {
            // 星星层用 destination-out 做透明拖尾，避免盖住背景层
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'source-over';

            drawBackground();

            stars.forEach(star => star.update());

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const star = shootingStars[i];
                star.update();
                if (star.opacity <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            for (let i = burstParticles.length - 1; i >= 0; i--) {
                const p = burstParticles[i];
                p.update();
                if (p.life <= 0) {
                    burstParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
