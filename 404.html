<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面迷失在星空中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            animation: fadeIn 2s ease-in-out;
        }

        .title-404 {
            font-size: 12rem;
            font-weight: bold;
            background: linear-gradient(45deg, #4fc3f7, #673ab7, #e91e63);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(103, 58, 183, 0.5),
                         0 0 40px rgba(79, 195, 247, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #ccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .home-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #673ab7, #4fc3f7);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(103, 58, 183, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        @media (max-width: 768px) {
            .title-404 {
                font-size: 5rem;
            }
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>

    <div class="container">
        <h1 class="title-404">404</h1>
        <p class="subtitle">页面迷失在浩瀚星空中</p>
        <a href="pc.html" class="home-btn">返回首页</a>
    </div>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 星空穿梭核心配置
        const stars = [];
        const shootingStars = [];
        const starsCount = 600; // 增加星星数量，穿梭效果更震撼
        const speed = 0.9; // 移动速度（可调整）

        // 随机数工具
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 🔥 3D穿梭星星类（向用户方向移动）
        class Star {
            constructor() {
                // 3D坐标：x/y 平面位置，z 深度（越靠近用户z越小）
                this.x = random(-canvas.width, canvas.width);
                this.y = random(-canvas.height, canvas.height);
                this.z = random(1, canvas.width);
                this.origZ = this.z;
            }

            update() {
                // 核心：z轴减小 = 向用户方向移动
                this.z -= speed;
                
                // 星星飞出屏幕后，重置到远处，循环效果
                if (this.z <= 0) {
                    this.z = canvas.width;
                    this.x = random(-canvas.width, canvas.width);
                    this.y = random(-canvas.height, canvas.height);
                    this.origZ = this.z;
                }

                // 3D转2D屏幕坐标（近大远小）
                const scale = canvas.width / this.z;
                const screenX = this.x * scale + canvas.width / 2;
                const screenY = this.y * scale + canvas.height / 2;
                const radius = scale * 2; // 越近越大
                const brightness = 1 - (this.z / this.origZ) * 0.5; // 越近越亮

                // 绘制星星
                ctx.beginPath();
                ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.fill();
            }
        }

        // 流星类（保留原效果）
        class ShootingStar {
            constructor() {
                this.x = random(0, canvas.width);
                this.y = 0;
                this.length = random(50, 150);
                this.speed = random(10, 20);
                this.angle = Math.PI / 6;
                this.opacity = 1;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.length * Math.cos(this.angle), this.y + this.length * Math.sin(this.angle));
                ctx.stroke();
                ctx.restore();
            }

            update() {
                this.x += this.speed * Math.cos(this.angle);
                this.y += this.speed * Math.sin(this.angle);
                this.opacity -= 0.015;
                this.draw();
            }
        }

        // 初始化星星
        for (let i = 0; i < starsCount; i++) {
            stars.push(new Star());
        }

        // 随机生成流星
        setInterval(() => {
            if (Math.random() > 0.97) {
                shootingStars.push(new ShootingStar());
            }
        }, 200);

        // 动画循环
        function animate() {
            // 拖影效果，让移动更丝滑
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => star.update());
            shootingStars.forEach((star, i) => {
                star.update();
                if (star.opacity <= 0) shootingStars.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        // 窗口适配
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
